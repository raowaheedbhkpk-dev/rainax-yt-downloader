name: Build RAINAX APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # Optional: sign with your own private key stored in GitHub Secrets.
      # Without these secrets the key bundled in the repo is used.
      - name: Prepare private signing key (if provided)
        env:
          KS_B64: ${{ secrets.RAINAX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rainax.keystore"
            echo "RAINAX_STORE_FILE=$RUNNER_TEMP/rainax.keystore" >> "$GITHUB_ENV"
            echo "Using private signing key from secrets"
          else
            echo "Using bundled signing key"
          fi

      - name: Build release APK
        env:
          RAINAX_STORE_PASSWORD: ${{ secrets.RAINAX_STORE_PASSWORD }}
          RAINAX_KEY_ALIAS: ${{ secrets.RAINAX_KEY_ALIAS }}
          RAINAX_KEY_PASSWORD: ${{ secrets.RAINAX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          NAME="RAINAX-YT-DOWNLOADER-${{ github.ref_name }}"
          NAME="${NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          sha256sum "$NAME.apk" > "$NAME.apk.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: RAINAX-YT-DOWNLOADER
          path: RAINAX-YT-DOWNLOADER-*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RAINAX-YT-DOWNLOADER-*.apk
            RAINAX-YT-DOWNLOADER-*.sha256
          generate_release_notes: true
