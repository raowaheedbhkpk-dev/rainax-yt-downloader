name: Build RAINAX APK

# Every push to main builds the APK: download it from the run's "Artifacts" (no GitHub release is made).
# Pushing a version tag (git tag v9.7.1 && git push origin v9.7.1) builds AND publishes the release
# (here and in rainax-tube-releases, where the app looks for updates).
# Starting it by hand (Actions > Run workflow) from a tag with "release" ticked does the same.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release (needs the version tag, e.g. v9.3, to exist)"
        type: boolean
        default: false

# Read-only by default; only the build job (it publishes the release) gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # git on the build machine: name new branches "main" (silences the "Using 'master' as the name..." hint in the log)
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      # third-party steps are pinned to exact versions (commit ids), so nobody can swap their code
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"

      # Signs with your private key stored in GitHub Secrets (create it once with scripts/make-private-key.sh).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.RAINAX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::No signing key. Run scripts/make-private-key.sh once to create it in GitHub Secrets."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rainax.keystore"
          echo "RAINAX_STORE_FILE=$RUNNER_TEMP/rainax.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RAINAX_STORE_PASSWORD: ${{ secrets.RAINAX_STORE_PASSWORD }}
          RAINAX_KEY_ALIAS: ${{ secrets.RAINAX_KEY_ALIAS }}
          RAINAX_KEY_PASSWORD: ${{ secrets.RAINAX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # The key file is not needed after signing: remove it before any other step runs
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rainax.keystore"

      - name: Name the APK
        run: |
          # named after the app version (e.g. RAINAX-YT-DOWNLOADER-v9.3.apk), also for builds without a tag
          VER=$(grep -oP 'isTag \? tagVersion : "\K[^"]+' app/build.gradle)
          NAME="RAINAX-YT-DOWNLOADER-v$VER"
          case "${{ github.ref }}" in refs/tags/v*) NAME="RAINAX-YT-DOWNLOADER-${{ github.ref_name }}";; esac
          NAME="${NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          sha256sum "$NAME.apk" > "$NAME.apk.sha256"
          # same file with a fixed name: .../releases/latest/download/RAINAX.apk always gives the newest version
          cp "$NAME.apk" RAINAX.apk

      - name: Version for the download name
        run: |
          echo "RX_VERSION=$(grep -oP 'isTag \? tagVersion : "\K[^"]+' app/build.gradle)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RAINAX-Tube-v${{ env.RX_VERSION }}-APK
          path: RAINAX-YT-DOWNLOADER-*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.release)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            RAINAX-YT-DOWNLOADER-*.apk
            RAINAX-YT-DOWNLOADER-*.sha256
            RAINAX.apk
          # "What's new" shown inside the app's update window: one short line per change
          body_path: whatsnew.txt

      # The same release in the PUBLIC releases repository (APK files only, no source code).
      # The app checks that repository for updates, so this repository can stay private.
      # Needs the secret RELEASES_TOKEN: a token that can write to raowaheedbhkpk-dev/rainax-tube-releases.
      - name: Publish to the public releases repository
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.release)
        env:
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the secret RELEASES_TOKEN (see README: Public releases repository)"
            exit 1
          fi

      - name: Upload the release there
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.release)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: raowaheedbhkpk-dev/rainax-tube-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: RAINAX Tube ${{ github.ref_name }}
          files: |
            RAINAX-YT-DOWNLOADER-*.apk
            RAINAX-YT-DOWNLOADER-*.sha256
            RAINAX.apk
          body_path: whatsnew.txt
