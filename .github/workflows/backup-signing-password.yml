name: Back up signing key (encrypted)

# Run by hand only: Actions tab > "Back up signing key (encrypted)" > Run workflow.
# It copies your signing key file and its password out of GitHub Secrets, packed together and encrypted
# with YOUR passphrase (secret RAINAX_BACKUP_PASSPHRASE), as a download that is deleted after 1 day.
# Nothing secret appears in the log, and the file is useless without your passphrase.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Pack the key file and password, encrypted with your backup passphrase
        env:
          KS_B64: ${{ secrets.RAINAX_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RAINAX_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RAINAX_KEY_PASSWORD }}
          ALIAS: ${{ secrets.RAINAX_KEY_ALIAS }}
          BACKUP_PASS: ${{ secrets.RAINAX_BACKUP_PASSPHRASE }}
        run: |
          if [ ${#BACKUP_PASS} -lt 12 ]; then
            echo "::error::First add the secret RAINAX_BACKUP_PASSPHRASE (at least 12 characters) in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASS" ]; then echo "::error::The signing key secrets are missing"; exit 1; fi
          umask 077
          mkdir -p pack out
          echo "$KS_B64" | base64 -d > pack/rainax-private.keystore
          printf 'Store password: %s\nKey password: %s\nKey alias: %s\n' "$STORE_PASS" "${KEY_PASS:-$STORE_PASS}" "${ALIAS:-rainax}" > pack/signing-password.txt
          # check the pair really opens, and show only the public fingerprint (safe to see)
          keytool -list -v -keystore pack/rainax-private.keystore -storetype PKCS12 -storepass:env STORE_PASS \
            | grep -E "Alias name|SHA256:" || { echo "::error::The password doesn't open the key file"; exit 1; }
          tar -C pack -cf bundle.tar rainax-private.keystore signing-password.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in bundle.tar -out out/rainax-signing-backup.enc -pass env:BACKUP_PASS
          shred -u bundle.tar pack/*
          echo "Encrypted backup ready. Download it from this run's Artifacts (kept 1 day)."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rainax-signing-backup
          path: out/rainax-signing-backup.enc
          retention-days: 1
