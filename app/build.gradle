plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The version comes from the git tag (v8.1.5 -> versionName 8.1.5, versionCode 80105), so the app
// always knows exactly which release it is and never asks to update to itself.
def tagVersion = (System.getenv("GITHUB_REF_NAME") ?: "").replaceFirst(/^v/, "")
def isTag = tagVersion ==~ /\d+\.\d+\.\d+/
def rxVersionName = isTag ? tagVersion : "8.2.4"
def rxParts = rxVersionName.tokenize('.').collect { it.toInteger() }
def rxVersionCode = rxParts[0] * 10000 + rxParts[1] * 100 + rxParts[2]

android {
    namespace 'com.rainax.ytdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.rainax.ytdownloader"
        minSdk 29
        targetSdk 34
        versionCode rxVersionCode
        versionName rxVersionName
    }

    // One fixed signing key for every build, so updates always install over the old version.
    // Your own key (GitHub Secrets) wins when present; otherwise the key bundled in the repo is used.
    signingConfigs {
        release {
            def envFile = System.getenv("RAINAX_STORE_FILE")
            storeFile envFile ? file(envFile) : file("rainax-release.keystore")
            storePassword System.getenv("RAINAX_STORE_PASSWORD") ?: "GCfbYGDaATxSWCBcPWEk"
            keyAlias System.getenv("RAINAX_KEY_ALIAS") ?: "rainax"
            keyPassword System.getenv("RAINAX_KEY_PASSWORD") ?: "GCfbYGDaATxSWCBcPWEk"
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false      // the extractor uses reflection (Rhino), so no shrinking
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { viewBinding true }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/README.md', 'META-INF/CHANGES',
                         'META-INF/COPYRIGHT']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // The fast YouTube extractor uses newer Java APIs; this makes them work on Android 10+
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    // RAINAX's own extractor (the same one and version NewPipe uses). Downloads use NativeDownloader. No yt-dlp.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:13a655fe53e0c3065f88725fc1fb594c3ede0169'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}

// Keep androidx.core compatible with AGP 8.5.2 / compileSdk 34
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1', 'androidx.core:core-ktx:1.13.1'
    }
}
