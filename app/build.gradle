plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rainax.ytdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.rainax.ytdownloader"
        minSdk 29
        targetSdk 34
        versionCode 12
        versionName "7.4.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    // One fixed signing key for every build, so updates always install over the old version.
    // Your own key (GitHub Secrets) wins when present; otherwise the key bundled in the repo is used.
    signingConfigs {
        release {
            def envFile = System.getenv("RAINAX_STORE_FILE")
            storeFile envFile ? file(envFile) : file("rainax-release.keystore")
            storePassword System.getenv("RAINAX_STORE_PASSWORD") ?: "GCfbYGDaATxSWCBcPWEk"
            keyAlias System.getenv("RAINAX_KEY_ALIAS") ?: "rainax"
            keyPassword System.getenv("RAINAX_KEY_PASSWORD") ?: "GCfbYGDaATxSWCBcPWEk"
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false      // yt-dlp / FFmpeg use reflection and native code, so no shrinking
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { viewBinding true }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.+'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+'
}

// Keep androidx.core compatible with AGP 8.5.2 / compileSdk 34
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1', 'androidx.core:core-ktx:1.13.1'
    }
}
