plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The version comes from the git tag (v8.1.5 -> versionName 8.1.5, versionCode 80105), so the app
// always knows exactly which release it is and never asks to update to itself.
def tagVersion = (System.getenv("GITHUB_REF_NAME") ?: "").replaceFirst(/^v/, "")
def isTag = tagVersion ==~ /\d+\.\d+\.\d+/
def rxVersionName = isTag ? tagVersion : "8.9.20"
def rxParts = rxVersionName.tokenize('.').collect { it.toInteger() }
def rxVersionCode = rxParts[0] * 10000 + rxParts[1] * 100 + rxParts[2]

// Fingerprint (SHA-256) of the signing key, read from the private key in GitHub Secrets at build time.
// The app checks it at start: a copy re-signed by someone else shows "not the official RAINAX".
// Without the key (forks, local builds) it is empty and the check is off.
def rxKeyFingerprint = {
    def path = System.getenv("RAINAX_STORE_FILE")
    def pass = System.getenv("RAINAX_STORE_PASSWORD")
    if (!path || !pass) return ""
    try {
        def ks = java.security.KeyStore.getInstance("PKCS12")
        new File(path).withInputStream { ks.load(it, pass.toCharArray()) }
        def alias = System.getenv("RAINAX_KEY_ALIAS") ?: "rainax"
        def cert = ks.getCertificate(alias) ?: ks.getCertificate(ks.aliases().nextElement())
        return java.security.MessageDigest.getInstance("SHA-256").digest(cert.encoded).encodeHex().toString()
    } catch (Exception e) {
        println("RAINAX: couldn't read the signing key fingerprint: " + e.message)
        return ""
    }
}()

android {
    namespace 'com.rainax.ytdownloader'
    compileSdk 34
    // NDK and CMake already installed on GitHub's build machines (no download needed)
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.rainax.ytdownloader"
        minSdk 29
        targetSdk 34
        versionCode rxVersionCode
        versionName rxVersionName
        buildConfigField "String", "KEY_SHA256", "\"${rxKeyFingerprint}\""

        // the MP3 encoder is native code: build it for real phones (64/32-bit ARM) and x86_64 emulators
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.5"
        }
    }

    // One fixed signing key for every build, so updates always install over the old version.
    // The key lives only in GitHub Secrets (scripts/make-private-key.sh); it is never stored in the repository.
    def rxStoreFile = System.getenv("RAINAX_STORE_FILE")
    signingConfigs {
        release {
            if (rxStoreFile) {
                storeFile file(rxStoreFile)
                storePassword System.getenv("RAINAX_STORE_PASSWORD")
                keyAlias System.getenv("RAINAX_KEY_ALIAS") ?: "rainax"
                keyPassword System.getenv("RAINAX_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false      // the extractor uses reflection (Rhino), so no shrinking
            shrinkResources false
            // without the secrets (e.g. a fork or a local build) the APK is left unsigned
            signingConfig rxStoreFile ? signingConfigs.release : null
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/README.md', 'META-INF/CHANGES',
                         'META-INF/COPYRIGHT']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // The fast YouTube extractor uses newer Java APIs; this makes them work on Android 10+
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    // RAINAX's own extractor (the same one and version NewPipe uses). Downloads use NativeDownloader. No yt-dlp.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:13a655fe53e0c3065f88725fc1fb594c3ede0169'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}

// Keep androidx.core compatible with AGP 8.5.2 / compileSdk 34
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1', 'androidx.core:core-ktx:1.13.1'
    }
}
